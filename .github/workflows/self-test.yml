name: Self-test

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-rc.*"]

permissions:
  contents: read # No write scope

jobs:
  go-pass:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/pass

  go-nested:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/nested/inner/deep

  go-lint-override-yml:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/lint-override-yml

  go-lint-override-yaml:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/lint-override-yaml

  go-lint-override-parent:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/lint-override-parent/sub

  go-integration-pg:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/integration-pg
      integration-command: go test -tags=integration ./...

  go-integration-valkey:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/go/integration-valkey
      integration-command: go test -tags=integration ./...

  typespec-current:
    uses: ./.github/workflows/typespec.yml
    with:
      working-directory: testdata/typespec/pass-current

  typespec-no-gitignore:
    uses: ./.github/workflows/typespec.yml
    with:
      working-directory: testdata/typespec/pass-no-gitignore

  frontend-npm:
    uses: ./.github/workflows/frontend.yml
    with:
      working-directory: testdata/frontend/pass-npm

  frontend-pnpm:
    uses: ./.github/workflows/frontend.yml
    with:
      working-directory: testdata/frontend/pass-pnpm

  compose-pass:
    uses: ./.github/workflows/compose.yml
    with:
      working-directory: testdata/compose/pass
      integration-command: bash scripts/smoke-test.sh

  compose-no-integration:
    uses: ./.github/workflows/compose.yml
    with:
      working-directory: testdata/compose/pass

  image-pass:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      context: testdata/image/pass
      push: false
      platforms: ${{ vars.SELF_TEST_LOCAL == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

  image-push-guard:
    # A tag run pushes in image-push-rc. This job must not push on a tag.
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      context: testdata/image/pass
      push: true
      platforms: linux/amd64

  image-push-rc:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.')
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      context: testdata/image/pass
      image-name: techorionai/constellation-ci-selftest
      push: true

  check-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check this repository
        run: bash scripts/check-repo.sh --constellation-ci .
      - name: Check the good fixtures
        run: |
          for dir in testdata/check-repo-pass/*/; do
            args=""
            [ -f "${dir}args.txt" ] && args=$(cat "${dir}args.txt")
            # shellcheck disable=SC2086
            bash scripts/check-repo.sh $args "${dir%/}"
          done
      - name: Check the bad fixtures
        run: |
          status=0
          for dir in testdata/check-repo/*/; do
            dir=${dir%/}
            code=0
            args=""
            [ -f "$dir/args.txt" ] && args=$(cat "$dir/args.txt")
            # shellcheck disable=SC2086
            output=$(bash scripts/check-repo.sh $args "$dir" 2>&1) || code=$?
            if [ "$code" -eq 0 ]; then
              echo "FAIL  $dir: the script passed, but it must fail"
              status=1
            elif ! grep -qF "$(cat "$dir/expect.txt")" <<< "$output"; then
              echo "FAIL  $dir: the script failed for a wrong reason"
              echo "$output"
              status=1
            else
              echo "PASS  $dir"
            fi
          done
          exit "$status"

  must-fail:
    if: vars.SELF_TEST_LOCAL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install act
        env:
          # gh needs a token value to start, but a local install makes no API call.
          # Thus the step gets a placeholder and not the workflow token.
          GH_TOKEN: unused
          GH_ACT_SHA256: 3bfe7761eced9e3de6e9a8146897bcbdf4bdc44fcb43c2493f0d652e8d25d182
        run: |
          # Download the release asset, check its SHA-256, and install it from a local folder.
          dir="$RUNNER_TEMP/gh-act"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gh-act" https://github.com/nektos/gh-act/releases/download/v0.2.97/linux-amd64
          echo "$GH_ACT_SHA256  $dir/gh-act" | sha256sum -c -
          chmod +x "$dir/gh-act"
          (cd "$dir" && gh extension install .)
      - name: Run the cases that must fail
        env:
          # act passes this read-only token to the actions. An empty token gives "Bad credentials"
          # in the metadata-action step of the image workflow.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/self-test.sh testdata/callers
      - name: Check that a wrong step is found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          output=$(bash scripts/self-test.sh testdata/self-test-wrong-step 2>&1) || code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "The script must exit with a non-zero code for a wrong step."
            exit 1
          fi
          grep -q "wrong step" <<< "$output"

  result:
    if: always()
    timeout-minutes: 10
    needs:
      - go-pass
      - go-nested
      - go-lint-override-yml
      - go-lint-override-yaml
      - go-lint-override-parent
      - go-integration-pg
      - go-integration-valkey
      - typespec-current
      - typespec-no-gitignore
      - frontend-npm
      - frontend-pnpm
      - compose-pass
      - compose-no-integration
      - image-pass
      - image-push-guard
      - image-push-rc
      - check-repo
      - must-fail
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      NEEDS: ${{ toJSON(needs) }}
      SELF_TEST_LOCAL: ${{ vars.SELF_TEST_LOCAL }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      REF_TYPE: ${{ github.ref_type }}
      REF: ${{ github.ref }}
    steps:
      - name: Check the results of all jobs
        run: |
          status=0
          while IFS=$'	' read -r name result; do
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$name" = image-push-guard ] && [ "$REF_TYPE" = tag ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$name" = image-push-rc ]; then
              case "$REF" in
                refs/tags/v*-rc.*) ;;
                *) continue ;;
              esac
            fi
            if [ "$result" = skipped ] && [ "$name" = must-fail ] && [ "$SELF_TEST_LOCAL" = true ]; then
              continue
            fi
            echo "FAIL  $name: $result"
            status=1
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          exit "$status"
      - name: Check that the integration job of each no-integration case is skipped
        if: env.SELF_TEST_LOCAL != 'true'
        run: |
          status=0
          for job in "go-pass / integration" "compose-no-integration / integration"; do
            conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq ".jobs[] | select(.name == \"$job\") | .conclusion")
            echo "Conclusion of $job: $conclusion"
            if [ "$conclusion" != skipped ]; then
              status=1
            fi
          done
          exit "$status"
      - name: Check that no image is pushed by the guard jobs
        if: env.SELF_TEST_LOCAL != 'true'
        run: |
          # The job publish is the only job that logs in and pushes. It must be skipped here.
          jobs="image-pass / publish"
          if [ "$REF_TYPE" != tag ]; then
            jobs="$jobs|image-push-guard / publish"
          fi
          status=0
          IFS='|' read -r -a names <<< "$jobs"
          for job in "${names[@]}"; do
            conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq ".jobs[] | select(.name == \"$job\") | .conclusion")
            echo "Conclusion of $job: $conclusion"
            if [ "$conclusion" != skipped ]; then
              status=1
            fi
          done
          if [ "$REF_TYPE" != tag ]; then
            conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq ".jobs[] | select(.name == \"image-push-guard / build\") | .conclusion")
            echo "Conclusion of image-push-guard / build: $conclusion"
            if [ "$conclusion" != success ]; then
              status=1
            fi
          fi
          exit "$status"
